name: Linux release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux packages (x86_64)
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libssl-dev \
            libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libwebkit2gtk-4.1-dev libfuse2 patchelf

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Build .deb and AppImage
        run: npm run tauri -- build --bundles deb,appimage

      - name: Verify release artifacts and generate SHA-256 checksums
        shell: bash
        run: |
          bundle_dir="src-tauri/target/release/bundle"
          artifact_list="$(mktemp)"
          find "$bundle_dir" -type f \( -name '*.deb' -o -name '*.AppImage' \) -print0 > "$artifact_list"
          if [[ ! -s "$artifact_list" ]]; then
            echo "No .deb or AppImage artifacts were generated." >&2
            exit 1
          fi
          if ! grep -zq '\.AppImage$' "$artifact_list"; then
            echo "AppImage artifact is missing; refusing to publish an incomplete release." >&2
            exit 1
          fi
          xargs -0 sha256sum < "$artifact_list" > SHA256SUMS
          rm -f "$artifact_list"
          cat SHA256SUMS

      - name: Publish release artifacts
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            SHA256SUMS
